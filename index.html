<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>neon type</title>
  <link rel="stylesheet" href="style.css?v=0.4" />
</head>
<body>
  <div class="screen">
    <header class="hud">
      <div>SCORE <b id="score">000000</b></div>
      <div>LVL <b id="level">01</b></div>
      <div>WPM <b id="wpm">0</b></div>
      <div>ACC <b id="accuracy">100%</b></div>
      <div class="lives" id="lives">♥♥♥</div>
      <button id="pause-btn" class="hud-btn" title="pause (esc)">❚❚ pause</button>
    </header>

    <!-- har doim ko'rinib turadigan burchakdagi tugmalar -->
    <div class="corner">
      <button id="sound-btn" class="hud-btn">sound on</button>
      <button id="fs-btn" class="hud-btn" title="fullscreen (f)">⛶ fullscreen</button>
    </div>

    <main id="arena">
      <div id="ground"></div>
      <div id="level-up" class="level-up hidden">level 2</div>
    </main>

    <footer class="prompt">
      <span class="caret">&gt;</span>
      <input id="typing" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" disabled />
    </footer>

    <section id="start-screen" class="overlay">
      <h1 class="title">neon<span>type</span></h1>
      <p class="tagline">type the words before they hit the floor.</p>

      <div class="menu" id="lang-menu">
        <button class="opt active" data-lang="en">english</button>
        <button class="opt" data-lang="uz">o'zbekcha</button>
        <button class="opt" data-lang="code">code</button>
      </div>
      <div class="menu" id="mode-menu">
        <button class="opt active" data-mode="normal">normal</button>
        <button class="opt" data-mode="hard">hard</button>
      </div>
      <p class="small mode-hint" id="mode-hint">3 lives · regular speed</p>

      <button id="start-btn" class="press">press ENTER to start</button>
      <p class="small">best (<span id="best-mode">normal</span>): <b id="best-start">0</b></p>
      <button id="board-btn" class="action lb-only">[ L ] leaderboard</button>
      <p class="sign">v0.4 · made by khusan</p>
    </section>

    <section id="board-screen" class="overlay hidden">
      <h2 class="title board-title">top 10</h2>
      <div class="menu" id="board-tabs">
        <button class="opt active" data-board="normal">normal</button>
        <button class="opt" data-board="hard">hard</button>
      </div>
      <table class="board" id="board-table"></table>
      <p class="small" id="board-status"></p>
      <button id="board-back" class="action">[ esc ] back</button>
    </section>

    <section id="pause-screen" class="overlay dim hidden">
      <h2 class="title paused">paused</h2>
      <p class="small">esc — resume · q — main menu</p>
      <div class="actions">
        <button id="resume-btn" class="action main">▶ resume</button>
        <button id="quit-btn" class="action">⌂ back to main menu</button>
      </div>
    </section>

    <section id="over-screen" class="overlay hidden">
      <h2 class="title over">game over</h2>
      <table class="results">
        <tr><td>score</td><td id="final-score">0</td></tr>
        <tr><td>words</td><td id="final-words">0</td></tr>
        <tr><td>wpm</td><td id="final-wpm">0</td></tr>
        <tr><td>accuracy</td><td id="final-accuracy">0%</td></tr>
      </table>
      <p id="new-best" class="new-best hidden">new best!</p>
      <form id="submit-form" class="submit lb-only">
        <input id="name-input" maxlength="12" placeholder="your name" autocomplete="off" spellcheck="false" />
        <button type="submit" id="submit-btn" class="action main">save to leaderboard</button>
      </form>
      <p class="small" id="submit-status"></p>
      <div class="actions">
        <button id="restart-btn" class="action main">[ enter ] play again</button>
        <button id="exit-btn" class="action">[ esc ] exit</button>
      </div>
    </section>
  </div>

  <script src="config.js?v=0.4"></script>
  <script src="script.js?v=0.4"></script>
</body>
</html>
